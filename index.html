<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Button Component</title>


    <style>
    html {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 35px;
    }

    /* base button/ "pill" component 
    this is the base styles that all the buttons will have in common before adding modifiers*/
    .c-button {
        border: 0;
        border-radius: 5px;
        padding: 10px 20px;
        font-size: 12px;
    }
</style>
  </head>

    <body>
        <h1>Button Component</h1>

        <h2>Primary Button</h2>
        <button class="c-button c-button--primary">
            Primary
        </button>

        <h2>Secondary Button</h2>
        <button class="c-button c-button--secondary">
            Secondary
        </button>

        <h2>Disabled Button</h2>
        <button
            class="c-button c-button--disabled"
            disabled>
            Disabled
        </button>

        <h2>Outline Button</h2>
        <button class="c-button c-button--outline">
            Outline
        </button>
    </body>
</html>
