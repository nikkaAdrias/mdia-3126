<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Button Component</title>


   <style>
    html {
        font-family: sans-serif;
        margin: 40px;
    }

    /* BUTTON COMPONENT */
    .c-button {
        border: 0;
        border-radius: 5px;
        padding: 10px 20px;
        font-size: 16px;
    }

    .c-button--primary {
        background-color: hotpink;
        color: white;
        font-weight: bold;
    }

    .c-button--secondary {
        background-color: palevioletred;
        color: white;
    }

    .c-button--disabled {
        background-color: lightgray;
        color: white;
    }

    .c-button--outline {
        background-color: pink;
        color: white;
        border: 1px solid palevioletred;
    }
</style>
  </head>

    <body>
        <h1>Button Component</h1>

        <h2>Primary Button</h2>
        <button class="c-button c-button--primary">
            Primary
        </button>

        <h2>Secondary Button</h2>
        <button class="c-button c-button--secondary">
            Secondary
        </button>

        <!-- note: the disabled button would work because of "disabled" written AFTER the class name in quotations. that's the actual HTML attribute. has nothing to do with the styling/ modifiers.-->
        <h2>Disabled Button</h2>
        <button
            class="c-button c-button--disabled"
            disabled>
            Disabled
        </button>

        <h2>Outline Button</h2>
        <button class="c-button c-button--outline">
            Outline
        </button>
    </body>
</html>
